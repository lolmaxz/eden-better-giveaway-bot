name: giveaway-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giveaway-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/dev.db
    volumes:
      - giveaway-data:/data
      - ./prisma/dev.db:/seed/dev.db:ro
    # Discord outbound only — no published ports.

volumes:
  giveaway-data:
